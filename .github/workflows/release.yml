name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions:
  contents: read
concurrency: release-${{ github.repository }}
jobs:
  test:
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@54da2b6d20fda9febf3cd02039424a1a8249cffb
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main
        mapfile -t resolved < <(python3 tools/resolve_release.py "$BUMP" "$GITHUB_SHA")
        version=${resolved[0]}
        tag=${resolved[1]}
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Check project
      uses: nicodes/komizo/run@54da2b6d20fda9febf3cd02039424a1a8249cffb
      with:
        target: check
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: tested-release-bytes
        path: |
          dist/@aviorstudio_gd-gesture.zip
          dist/@aviorstudio_gd-gesture.zip.sha256
        if-no-files-found: error
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tested-release-bytes
        path: dist
    - name: Verify tested artifact identity
      run: (cd dist && sha256sum --check --strict @aviorstudio_gd-gesture.zip.sha256)
    - name: Create GitHub Release from tested bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.test.outputs.tag }}
      run: |
        set -euo pipefail
        expected="$(cut -d' ' -f1 dist/@aviorstudio_gd-gesture.zip.sha256)"
        if gh release view "$TAG" >/dev/null 2>&1; then
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="@aviorstudio_gd-gesture.zip") | .digest' | sed 's/^sha256://')"
          test "$actual" = "$expected"
          echo "Existing release asset matches tested bytes; resuming registry publication."
        else
          gh release create "$TAG" dist/@aviorstudio_gd-gesture.zip dist/@aviorstudio_gd-gesture.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
        fi
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308
      with:
        tag: ${{ needs.test.outputs.tag }}
        api-key: ${{ secrets.GDAM_API_KEY }}
        asset: '@aviorstudio_gd-gesture.zip'
