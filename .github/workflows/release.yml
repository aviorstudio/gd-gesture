name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          mapfile -t resolved < <(python3 tools/resolve_release.py "$BUMP" "$GITHUB_SHA")
          version=${resolved[0]}
          tag=${resolved[1]}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test exact release commit and build package once
        uses: ./.github/actions/test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release-bytes
          path: |
            dist/@aviorstudio_gd-gesture.zip
            dist/@aviorstudio_gd-gesture.zip.sha256
          if-no-files-found: error

  publish:
    needs: test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-bytes
          path: dist
      - name: Verify tested artifact identity
        run: (cd dist && sha256sum --check --strict @aviorstudio_gd-gesture.zip.sha256)
      - name: Create GitHub Release from tested bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 dist/@aviorstudio_gd-gesture.zip.sha256)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="@aviorstudio_gd-gesture.zip") | .digest' | sed 's/^sha256://')"
            test "$actual" = "$expected"
            echo "Existing release asset matches tested bytes; resuming registry publication."
          else
            gh release create "$TAG" dist/@aviorstudio_gd-gesture.zip dist/@aviorstudio_gd-gesture.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
          fi
      - name: Publish to GDAM
        uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308 # v0.5.1
        with:
          tag: ${{ needs.test.outputs.tag }}
          api-key: ${{ secrets.GDAM_API_KEY }}
          asset: '@aviorstudio_gd-gesture.zip'
