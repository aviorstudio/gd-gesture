name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          tag="v$version"
          test -z "$(git tag --list "$tag")"
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
          test "$plugin_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test exact release commit and build package once
        uses: ./.github/actions/test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release-bytes
          path: |
            dist/@aviorstudio_gd-gesture.zip
            dist/@aviorstudio_gd-gesture.zip.sha256
          if-no-files-found: error

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release-bytes
          path: dist
      - name: Verify tested artifact identity
        run: (cd dist && sha256sum --check --strict @aviorstudio_gd-gesture.zip.sha256)
      - name: Create GitHub Release from tested bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
        run: gh release create "$TAG" dist/@aviorstudio_gd-gesture.zip dist/@aviorstudio_gd-gesture.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
      - name: Install GDAM
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
      - name: Publish to GDAM
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: ${{ needs.test.outputs.version }}
          tag: ${{ needs.test.outputs.tag }}
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
