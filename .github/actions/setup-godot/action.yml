name: Setup checksummed Godot
description: Install the repository-reviewed Godot 4.7.2 archive by immutable checksum.

runs:
  using: composite
  steps:
    - name: Read Godot identity
      id: identity
      shell: bash
      run: echo "manifest-sha=$(sha256sum tools/godot-release.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache reviewed Godot archive
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/gd-gesture-godot-downloads
        key: gd-gesture-godot-${{ steps.identity.outputs.manifest-sha }}-${{ runner.os }}

    - name: Install verified Godot
      shell: bash
      run: RUNNER_TEMP="$RUNNER_TEMP" ./tools/setup_godot.sh
