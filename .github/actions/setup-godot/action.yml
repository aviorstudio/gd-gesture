name: Setup verified Godot
description: Read caller-owned release manifest and install through released shared
  setup
runs:
  using: composite
  steps:
  - name: Validate caller release identity
    id: identity
    shell: bash
    run: "python3 - <<'PYTHON'\nimport json, os, re\nfrom pathlib import Path\nrelease=json.loads(Path('tools/godot-release.json').read_text())\n\
      version=release['version']\nif not re.fullmatch(r'\\d+\\.\\d+\\.\\d+', version):\n\
      \    raise ValueError('invalid engine version')\nfor kind, archive in [('binary',\
      \ f'Godot_v{version}-stable_linux.x86_64.zip'), ('templates', f'Godot_v{version}-stable_export_templates.tpz')]:\n\
      \    if release[kind+'_archive'] != archive or not re.fullmatch(r'[a-f0-9]{128}',\
      \ release[kind+'_sha512']):\n        raise ValueError('invalid reviewed release\
      \ identity')\nwith open(os.environ['GITHUB_OUTPUT'],'a') as output:\n    print('version='+version,file=output)\n\
      \    for kind in ['binary','templates']:\n        print(kind+'-checksum=sha512:'+release[kind+'_sha512'],file=output)\n\
      PYTHON\n"
  - uses: nicodes/tools/godot-setup@cf0e560c9bbb888488191fcce03409b6c6fbdc28
    with:
      version: ${{ steps.identity.outputs.version }}
      origin: godot
      binary-checksum: ${{ steps.identity.outputs.binary-checksum }}
      templates-checksum: ${{ steps.identity.outputs.templates-checksum }}
      install-templates: 'true'
